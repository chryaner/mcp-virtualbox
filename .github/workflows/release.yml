name: release

# Pushing a tag vX.Y.Z publishes that version: to npm with a provenance
# statement, so the package can be traced to this commit and this workflow,
# and as a GitHub release with that version's section of the changelog.
#
# npm has to know this workflow is allowed to publish the package: on
# npmjs.com, under the package's settings, add this repository and
# release.yml as a trusted publisher. No token is stored anywhere.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag is the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm publish --provenance --access public
      - name: GitHub release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
