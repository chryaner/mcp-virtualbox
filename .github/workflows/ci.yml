name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The built server, started and spoken to the way a client does.
      - run: npm run smoke

  # What gets published: the packed tarball, installed and run with nothing
  # else around it, on the oldest Node the package claims to support.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Install the tarball and start the server
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/install && cd /tmp/install
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/mcp-virtualbox-*.tgz
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | npx mcp-virtualbox > /tmp/out.jsonl
          test "$(sed -n 2p /tmp/out.jsonl | jq '.result.tools | length')" = 33

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high
